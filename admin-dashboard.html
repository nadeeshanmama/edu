<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
</head>
<body>
<h2>Add Lesson to Student</h2>
<form id="addLessonForm">
  <input type="email" id="studentEmail" placeholder="Student Email" required>
  <input type="text" id="youtubeId" placeholder="YouTube Video ID" required>
  <button type="submit">Add Lesson</button>
</form>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
  apiKey: "AIzaSyAEkxTwVTNOiDr5nqJzlF32GIhlts-HpRk",
  authDomain: "edupeak-bea8c.firebaseapp.com",
  projectId: "edupeak-bea8c",
  storageBucket: "edupeak-bea8c.firebasestorage.app",
  messagingSenderId: "783539303255",
  appId: "1:783539303255:web:4bb068761756a756dac412",
  measurementId: "G-SCMVNDB400"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  document.getElementById("addLessonForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("studentEmail").value;
    const youtubeId = document.getElementById("youtubeId").value;

    const studentRef = doc(db, "students", email);
    const studentSnap = await getDoc(studentRef);

    if (!studentSnap.exists()) {
      alert("Student not found");
      return;
    }

    await updateDoc(studentRef, {
      lessons: arrayUnion(youtubeId)
    });

    alert("Lesson added!");
    document.getElementById("addLessonForm").reset();
  });
</script>
</body>
</html>
