<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPeak - Login</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-left">
                <img src="study-image.svg" alt="Student studying">
                <div class="tagline">ඔබේ ඉලක්කයේ Target එකට</div>
            </div>
            <div class="login-right">
                <div class="logo">
                    <h1>CM with MN</h1>
                    <p>Combined Maths - Madushan Neranjan</p>
                    <p>ඔබේ අරමුණ වෙත ගමන් සැලසුමකට පිවිසෙන්න</p>
                </div>
                <div class="colored-shapes">
                    <div class="shape red-triangle"></div>
                    <div class="shape green-square"></div>
                    <div class="shape blue-x"></div>
                    <div class="shape yellow-circle"></div>
                </div>
                <input type="email" id="adminEmail" placeholder="Admin Email">
                <input type="password" id="adminPass" placeholder="Password">
                 <button id="adminLogin">Admin Login</button>
                <button id="googleLogin" class="google-btn">
                    <img src="google-icon.svg" alt="Google">
                    Continue with Google
                </button>
                <div class="social-links">
                    <a href="#" class="facebook-icon">
                        <img src="facebook-icon.svg" alt="Facebook">
                    </a>
                    <a href="#" class="youtube-icon">
                        <img src="youtube-icon.svg" alt="YouTube">
                    </a>
                    <a href="#" class="telegram-icon">
                        <img src="telegram-icon.svg" alt="Telegram">
                    </a>
                </div>
                <div class="register-help">
                    <a href="#">How to Register?</a>
                </div>
                <div class="contact">
                    <p>Hotline Contact: 0741591704</p>
                </div>
                <div class="footer">
                    <p>Powered by CMwithMN Developers</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
