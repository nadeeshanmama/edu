<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>
</head>
<body>
<h2>My Lessons</h2>
<div id="lessonsContainer"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAEkxTwVTNOiDr5nqJzlF32GIhlts-Hr8k",
    authDomain: "edupeak-bea8c.firebaseapp.com",
    projectId: "edupeak-bea8c",
    storageBucket: "edupeak-bea8c.appspot.com",
    messagingSenderId: "783539303255",
    appId: "1:783539303255:web:4bb068761756a756dac412",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const email = localStorage.getItem("studentEmail");
  if (!email) {
    window.location.href = "index.html"; // not logged in
  }

  const container = document.getElementById("lessonsContainer");

  async function loadLessons() {
    const studentRef = doc(db, "students", email);
    const studentSnap = await getDoc(studentRef);
    if (!studentSnap.exists()) {
      container.innerHTML = "<p>No lessons assigned yet.</p>";
      return;
    }

    const lessons = studentSnap.data().lessons;
    container.innerHTML = "";
    lessons.forEach(id => {
      const iframe = document.createElement("iframe");
      iframe.width = "560";
      iframe.height = "315";
      iframe.src = `https://www.youtube.com/embed/${id}`;
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
      iframe.allowFullscreen = true;
      container.appendChild(iframe);
    });
  }

  loadLessons();
</script>
</body>
</html>
